# 혼자 쓰는 로컬 도구: 내 PC에서만 접속 가능하도록 localhost 바인딩
server.address=127.0.0.1
server.port=8080

# H2 파일 DB (홈 디렉터리 아래 보관)
spring.datasource.url=jdbc:h2:file:${user.home}/.ai-dashboard/db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 수집기 설정
# 쉼표로 여러 경로 지정 가능. 기본값은 Claude Code 대화 기록 폴더
collector.claude-code.paths=${user.home}/.claude/projects
# 자동 수집 주기 (ms). 기본 5분
collector.interval-ms=300000

# AI 공통 채널(Google 시트) 수집. 시트 ID 는 환경 변수 CHANNEL_SHEET_ID 로 지정 (비우면 사용 안 함)
# 시트는 "링크가 있는 모든 사용자: 뷰어"로 공유되어 있어야 함
collector.sheet.id=${CHANNEL_SHEET_ID:}
# 메시지 탭의 gid (시트 URL 의 #gid= 값)
collector.sheet.gid=${CHANNEL_SHEET_GID:0}
collector.sheet.zone=Asia/Seoul
